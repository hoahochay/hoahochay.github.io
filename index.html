<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚗️</text></svg>" />
    <title>Phòng thí nghiệm hóa học ảo</title>
  </head>
  <body>
    <div id="app"></div>

    <aside id="chem" class="card"></aside>

    <aside id="panel" class="card">
      <div id="info"></div>
      <div class="sec">Nhật ký hiện tượng</div>
      <ul id="log"></ul>
    </aside>

    <div id="toolbar" class="card">
      <div class="group"><span class="k">Thời gian <b id="clock">0:00</b></span><div id="speed" class="seg"></div></div>
      <div class="group actions">
        <button id="btn-stir">🥄 Khuấy</button>
        <button id="btn-heat">🔥 Đun</button>
        <button id="btn-empty">🗑 Đổ bỏ</button>
        <button id="btn-focus">🔍 Nhìn gần</button>
      </div>
    </div>

    <div id="tip"></div>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
