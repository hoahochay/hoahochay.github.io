<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚗️</text></svg>" />
    <title>Phòng thí nghiệm hóa học ảo</title>
  </head>
  <body>
    <div id="app"></div>

    <nav id="mainnav" class="card">
      <button data-view="lab" class="on">⚗️ Phòng thí nghiệm</button>
      <button data-view="table">🧮 Bảng tuần hoàn</button>
      <button class="nav-help" title="Hướng dẫn thao tác (H)">❓ Hướng dẫn</button>
    </nav>
    <section id="ptable" class="hidden"></section>

    <aside id="left" class="card">
      <div class="tabs">
        <button data-tab="chem" class="on">Kho hóa chất</button>
        <button data-tab="recipes">Thí nghiệm mẫu</button>
        <button class="collapse" title="Thu gọn">‹</button>
      </div>
      <div id="chem" class="pane"></div>
      <div id="recipes" class="pane hidden"></div>
    </aside>

    <div id="recipe-bar" class="card hidden"></div>
    <div id="recipe-result" class="card hidden"></div>

    <aside id="panel" class="card">
      <div id="info"></div>
      <div class="sec">Nhật ký hiện tượng</div>
      <ul id="log"></ul>
    </aside>

    <div id="hint" class="card hidden"></div>
    <div id="toolbar" class="card">
      <div class="group"><span class="k">Thời gian <b id="clock">0:00</b></span><div id="speed" class="seg"></div></div>
      <div class="group actions">
        <button id="btn-stir">🥄 Khuấy</button>
        <button id="btn-heat">🔥 Đun</button>
        <button id="btn-empty">🗑 Đổ bỏ</button>
        <button id="btn-invert">🔃 Úp ống</button>
        <button id="btn-focus">🔍 Nhìn gần</button>
      </div>
    </div>

    <div id="tip"></div>
    <script type="module" src="/web/main.ts"></script>
  </body>
</html>
